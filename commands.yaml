# commands.yaml — единственный источник истины для jarvis-commands.
#
# Всё, что нужно развернуть в JARVIS, описывается здесь:
#   - generate: папки, которые build.ps1 СОБИРАЕТ полностью (command.yaml, names.txt, ahk/*.exe)
#   - manual:   папки, которые копируются как есть (их command.yaml/names.txt лежат в командах),
#               а build.ps1 пересобирает все ahk/*.ahk в .exe (пути берутся из config, токены %...%)
#   - stock:    папки из оригинального JARVIS/MSI — только для справки, не разворачиваются
#   - swear:    слова, которые автоматически добавляются к фразам при генерации (варианты фраз)
#
# Машинозависимые пути в этот файл НЕ кладут — они живут только в config.local.psd1
# (шаблон — config.example.psd1).

meta:
  jarvis_version: "0.0.2"      # единственный официальный релиз jarvis-app (тег beta)
  note: "Пути и локали — только в config.local.psd1"

# Слова, добавляемые к фразам генератором (аналог SWEAR из jarvis_data.txt).
# Если фраза уже содержит одно из этих слов — ей НЕ добавляются варианты (антидубликат).
swear:
- бля
- сука
- блин
- ёб

# Папки, которые копируются в JARVIS как есть (используется их собственный command.yaml).
# Список развёртывания = generate + manual — этим исчерпывается.
manual:
- youtube
- yamusic
- zapret

# Папки оригинального JARVIS/MSI, сохранённые в репозитории как справка. НЕ разворачиваются.
stock:
- ahkcompiller
- browser
- calculator
- discord
- explorer
- jarvis
- jokes
- multimedia
- open_vpn
- Spotify
- telegram
- VK music
- voice_film_searcher
- voice_recorder
- weather
- windows
- yadisk

# --- Генерируемые команды ---
# engine: voice     -> voice_note.py  --once <action>   (тихий звук, длинные реплики)
#         commands  -> commands.py    <action>           (запуск приложений, громкость и т.п.)
# confirm: true     -> команда требует подтверждения (см. scripts/confirm.py и README)
